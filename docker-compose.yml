version: '3.8'

services:
  # MySQL Database for Persistent Relational Storage
  mysql:
    image: mysql:8.0
    container_name: trustchain-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_trustchain_2026
      MYSQL_DATABASE: trustchain_db
      MYSQL_USER: trustchain_user
      MYSQL_PASSWORD: secure_trustchain_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Ethereum Local Devnet (Hardhat / Ganache node)
  ethereum-node:
    image: trufflesuite/ganache:latest
    container_name: trustchain-evm
    ports:
      - "8545:8545"
    command: ["--wallet.seed", "trustchain secure blockchain seed phrase 2026", "--chain.networkId", "1337", "--server.host", "0.0.0.0"]

  # Flask Machine Learning & REST API Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: trustchain-backend
    restart: always
    environment:
      DATABASE_URL: mysql+pymysql://trustchain_user:secure_trustchain_password@mysql:3306/trustchain_db
      BLOCKCHAIN_RPC_URL: http://ethereum-node:8545
      CONTRACT_ADDRESS: 0x5FbDB2315678afecb367f032d93F642f64180aa3
      FLASK_ENV: production
      SECRET_KEY: production_secret_key_trustchain_2026
      FLASK_PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
      ethereum-node:
        condition: service_started

  # React + TypeScript Frontend
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: trustchain-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - backend

volumes:
  mysql_data:
